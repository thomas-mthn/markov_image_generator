<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>image generator</title>
        <link rel="stylesheet" href="main.css">
	</head>
	<body>
		<a>train</a>
		<button onclick="serverLoadImagesTrain()">Select cloud image</button>
		<input type="file" id="train_file_input" accept="image/*"><br><br>
		<a>load</a>
		<button onclick="serverLoadImagesLoad()">Select cloud image</button>
		<input type="file" id="load_file_input" accept="image/*"><br><br>
		<div id="box_server_images"></div>
		<a for="input_quality">generation quality</a>
		<input id="input_quality" type="range" min="1" max="64" step="1" value="16">
		<a id="input_quality_value">16</a><br>
		<a>generation size</a>
		<input id="generation_size" type="range" min="64" max="2048" step="64" value="256">
		<a id="generation_size_value">256</a><br>
		<a>remix mipmap</a>
		<input id="remix_mipmap" type="range" min="1" max="16" step="1" value="4">
		<a id="remix_mipmap_value">4</a><br><br>
		<div id="client_buttons" class="button_group">
            <h3>client: </h3>
			<button onclick="imageGenerate()">generate</button>
			<button onclick="remixImage()">remix</button>
			<button onclick="imageOutpaint()">outpaint</button>
			<button onclick="inpaintImage()">inpaint</button>
			<button onclick="inpaintReverse()">inpaint reverse</button>
		</div><br>
		<div id="server_buttons_main" class="button_group">
            <h3>server: </h3>
			<button onclick="serverGenerateImage()">generate</button>
			<button onclick="serverRemixImage()">remix</button>
			<button onclick="serverOutpaintImage()">outpaint</button>
			<button onclick="serverTrain()">train</button>
			<button onclick="modelReset()">model</button>
		</div>
		<div id="server_buttons_generate" style="display:none">
			<a>get the image from: </a>
			<button onclick="serverTrainCloud()">cloud</button>
			<input type="file" id="server_train_local" accept="image/*">
		</div>
		<br><br>
		<input type="checkbox" id="checkbox_inpaint">
		<div id="cloud_generated"></div><br>
		<progress id="progress_bar" value="0"></progress><br>
		<canvas width="768" height="768" id="canvas" style="border: 2px solid white"></canvas><br>
        <button onclick="imageExport()">export</button>
	</body>
</html>
<script src="main.js"></script>
